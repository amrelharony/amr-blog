# Quality gates: lint + typecheck + unit tests on every push/PR, plus a build.
#
# The build prerenders /, /p/[slug], /feed.xml and /sitemap.xml, which fetch
# live data from Supabase (lib/supabase/public.ts needs the two NEXT_PUBLIC_*
# vars + network; queries throw on failure). It therefore requires the two repo
# secrets referenced in the `build` job — the anon key is public by design.
# If those secrets are absent the build job fails; Vercel remains the deploy gate.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # next 16 requires >= 20.9
          cache: npm
      - run: npm ci
      # Fail only on high/critical advisories; add --omit=dev if dev-dep noise
      # ever makes this flaky.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          # warn (not ignore) so a vitest crash that skips lcov generation is visible.
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
