name: Publish Scheduled Posts to LinkedIn

on:
  schedule:
    # Hourly — publishes due scheduled articles/thoughts to LinkedIn (links to blog.amrelharony.com/p/<slug>)
    - cron: '0 * * * *'
  workflow_dispatch:

# Only one publish run at a time: linkedin_posted is the dedup guard, read then
# written non-atomically, so overlapping runs (manual + scheduled) could double-post.
concurrency:
  group: publish-linkedin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish due posts to LinkedIn
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
        run: node scripts/publish-linkedin.mjs

      # Piggyback on this hourly schedule (the Vercel cron only runs every 3
      # days): db-keepalive publishes due scheduled articles AND sweeps the
      # instant-notification queue (see app/api/db-keepalive/route.ts step 5).
      - name: Run scheduled-publish + notification sweep
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -sf -m 60 -H "Authorization: Bearer $CRON_SECRET" \
              "https://blog.amrelharony.com/api/db-keepalive" || echo "sweep failed (non-fatal)"
          else
            echo "CRON_SECRET not set — skipping sweep"
          fi
